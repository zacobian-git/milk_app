name: milk_app
description: "Offline-first household milk ledger."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  drift: ^2.35.4
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1
  go_router: ^18.1.4
  intl: ^0.20.3
  pdf: '>=3.12.0 <3.13.0'
  printing: '>=5.14.2 <5.15.0'
  share_plus: ^13.3.1
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  file_picker: ^13.4.1
  local_auth: ^3.0.2
  fl_chart: ^1.3.1
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.6
  flutter_timezone: ^5.1.1
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/NotoSansDevanagari-Regular.ttf
